<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRPS</title>
<script src="https://jjojjolonglong-sudo.github.io/mnmn/fonts.v1.js" data-app="prps"></script>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f6f8fa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PRPS">
<script src="https://jjojjolonglong-sudo.github.io/mnmn/config.js"></script>
<script src="https://jjojjolonglong-sudo.github.io/mnmn/core.v1.js" data-app="prps"></script>
<style>
/* PRPS — 단편 소설 기획서. 한글 양식 그대로 A4 한 장. 차가운 회색·옅은 푸른색, 각진 모서리, 1px 선 */
:root{
  --ink:#1b1f24; --line:#000; --muted:#7a8591; --bg:#e9edf1; --side:#f6f8fa; --edge:#d5dbe1;
  --accent:#3d6a9a; --warn:#c0392b; --head:#f3f4f5; --ph:#c8cfd6;
  --fs:13px; --lh:20px; --tbl:680px; --lab:76px; --cola:222px; --pageh:1122px; --pm:57px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:"돋움",Dotum,AppleGothic,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border-radius:0}
[hidden]{display:none!important}

/* ── 폴더 연결 화면 ── */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px}
#gate .box{width:320px;max-width:100%;background:#fff;border:1px solid #c3ccd5;padding:28px 24px;text-align:center}
#gate .brand{padding:0 0 18px;justify-content:center}
#gmsg{margin:0;font-size:13px;line-height:20px;color:var(--ink);word-break:keep-all}
#gmsg small{display:block;margin-top:6px;font-size:12px;line-height:18px;color:var(--muted)}
#gate .gb{display:block;width:100%;margin-top:18px;padding:9px;background:var(--ink);color:#fff;border:0;font-size:14px;cursor:pointer}
#gate .gb.sub{margin-top:8px;background:#fff;color:var(--ink);border:1px solid #cfd6dd}
#gate .gb.sub:hover{border-color:var(--accent);color:var(--accent)}
/* ── 앱 ── */
#app{display:flex;height:100vh;height:100dvh}

/* 좌측: 정보 + 메뉴 */
#side{width:184px;flex:none;background:var(--side);border-right:1px solid var(--edge);display:flex;flex-direction:column;padding:16px 12px 8px}
.brand{font-weight:700;font-size:18px;letter-spacing:.16em;line-height:22px}
.info{display:flex;flex-direction:column;align-items:flex-start}
#docname{margin-top:12px;font-size:13px;line-height:18px;font-weight:600;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;width:100%}
#docname.none{color:var(--muted);font-weight:400}
#status{margin-top:4px;font-size:11px;line-height:16px;color:var(--muted);white-space:nowrap}
#status.warn{color:var(--warn)}
.iconbtn{width:28px;height:28px;flex:none;display:grid;place-items:center;background:#fff;border:1px solid #cfd6dd;padding:0;cursor:pointer;color:var(--ink)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.foot .iconbtn{border-color:#111;color:#111;opacity:.45}   /* 이동 메뉴 ▦와 같은 모양 */
.foot .iconbtn:hover{opacity:1;border-color:#111;color:#111}
.menu{display:flex;flex-direction:column;gap:6px;margin-top:24px}
.sb{display:block;width:100%;text-align:left;background:#fff;border:1px solid #cfd6dd;padding:8px 10px;font-size:13px;line-height:18px;cursor:pointer;white-space:nowrap}
.sb:hover{border-color:var(--accent);color:var(--accent)}
.sb.danger:hover{border-color:var(--warn);color:var(--warn)}
.spacer{flex:1}
/* 맨 아래 한 줄: 화면 왼쪽 아래 이동 메뉴(▦, 8px·28px) 바로 오른쪽부터 같은 높이로 */
.foot{display:flex;flex-direction:row;gap:6px;height:28px;margin-left:30px}

/* 본문: A4 한 장 */
#scroll{flex:1;min-width:0;overflow:auto;overscroll-behavior:none;padding:24px 16px 48px}
/* A4 종이: 네 변 여백 같게(57px), 기본 높이 A4, 내용이 길면 아래로 늘어남 */
.paper{width:794px;min-height:var(--pageh);margin:0 auto;padding:var(--pm);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* 양식 표 */
.sheet{width:var(--tbl);border-collapse:collapse;table-layout:fixed;font-size:var(--fs);line-height:var(--lh)}
.sheet col.c-lab{width:var(--lab)}
.sheet col.c-a{width:var(--cola)}
.sheet td{border:1px solid var(--line);padding:5px 8px;vertical-align:top}
.sheet td.lab{text-align:center;padding:5px 4px;white-space:nowrap}
.sheet td.name{padding:5px 4px}
.sheet td.head{text-align:center;vertical-align:middle;height:31px;padding:0 8px;background:var(--head);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.fld{display:block;width:100%;margin:0;padding:0;border:0;outline:0;background:transparent;color:inherit;
  font:inherit;line-height:var(--lh);resize:none;overflow:hidden;
  white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;text-align:justify;text-justify:inter-character;
  min-height:var(--lh);height:var(--lh)}
.fld.center{text-align:center;text-justify:auto}
.fld::placeholder{color:var(--ph);font-style:italic;opacity:1}


/* 목록 팝업 */
.modal{position:fixed;inset:0;background:rgba(20,28,36,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.mbox{width:420px;max-width:100%;max-height:80vh;max-height:80dvh;background:#fff;border:1px solid #c3ccd5;display:flex;flex-direction:column}
.mhead{display:flex;align-items:baseline;gap:8px;padding:14px 16px 10px;font-weight:600;font-size:14px}
.mhead span{font-weight:400;font-size:12px;color:var(--muted)}
#q{margin:0 16px 10px;padding:7px 9px;border:1px solid #cfd6dd;font:inherit;font-size:13px;outline:0;border-radius:0}
#q:focus{border-color:var(--accent)}
#list{list-style:none;margin:0;padding:0;overflow:auto;overscroll-behavior:contain;flex:1;border-top:1px solid var(--edge)}
#list li{padding:9px 16px 9px 13px;border-bottom:1px solid #edf0f3;border-left:3px solid transparent;cursor:pointer}
#list li:hover{background:#f3f6f9}
#list li.cur{border-left-color:var(--accent);background:#eef3f8}
#list .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .m{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .empty{color:var(--muted);font-size:13px;cursor:default;text-align:center;padding:24px;border-left:0}
#list .empty:hover{background:none}
.mclose{flex:none;border:0;border-top:1px solid var(--edge);background:var(--side);padding:12px;font-size:13px;cursor:pointer}
.mclose:hover{color:var(--accent)}


/* ── 스킨: 포스터 (shsh와 같은 색 — 회색기 핑크 벽, 미색 종이, 파란 잉크·선, 코랄 하트) ── */
.brand{display:flex;align-items:center;gap:6px}
.hrt{display:none;width:17px;height:17px;flex:none}
body.sk-poster{--ink:#1c3a80;--line:#2a60c6;--muted:#7584ad;--bg:#d1b6ad;--side:#e9e6cf;--edge:#2a60c6;--accent:#2a60c6;--warn:#d9545c;--head:#f8dcd8;--ph:#aab4d4;--card:#f4f2e3;--coral:#ef7f86;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .16 0 0 0 0 .38 0 0 0 0 .78 0 0 0 .1 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.sk-poster .hrt{display:block}
.sk-poster .logo{font:900 21px/1 'Arial Black','Helvetica Neue',system-ui,sans-serif;letter-spacing:.03em;color:transparent;-webkit-text-stroke:1.2px var(--line)}
.sk-poster #side{background:var(--side) var(--grain);border-right:1.5px solid var(--line)}
.sk-poster #docname{color:var(--ink)}
.sk-poster .sb{background:transparent;border:1.5px solid var(--line);color:var(--line);font-weight:600}
.sk-poster .sb:hover{background:var(--line);color:var(--card)}
.sk-poster .sb.danger:hover{background:var(--coral);border-color:var(--line);color:var(--ink)}
.sk-poster .paper{background:var(--card) var(--grain);border:2px solid var(--line);box-shadow:8px 8px 0 var(--coral);padding:calc(var(--pm) - 2px)}
/* 겉선은 한 겹 + 파란 딱딱한 그림자(shsh 태그 블록처럼) — 표 크기·여백은 기본과 같음 */
.sk-poster .sheet{color:var(--ink);box-shadow:3px 3px 0 var(--line);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sk-poster .sheet td.lab{color:var(--line);font-weight:700}
.sk-poster .sheet td.head{color:var(--line);font-weight:800;letter-spacing:.06em}
.sk-poster .fld::selection{background:#f5c3bf}
.sk-poster #gate .box,.sk-poster .mbox{background:var(--card) var(--grain);border:2px solid var(--line);box-shadow:6px 6px 0 var(--coral)}
.sk-poster #gate .gb{background:var(--line);color:var(--card);border:1.5px solid var(--line);font-weight:800;box-shadow:3px 3px 0 var(--coral)}
.sk-poster #gate .gb.sub{background:transparent;color:var(--line);box-shadow:none}
.sk-poster #q{background:var(--card);border-color:rgba(42,96,198,.45)}
.sk-poster #list{border-top:1.5px solid var(--line)}
.sk-poster #list li{border-bottom-color:rgba(42,96,198,.26)}
.sk-poster #list li:hover{background:rgba(255,255,255,.42)}
.sk-poster #list li.cur{border-left-color:var(--coral);background:#f8dcd8}
.sk-poster #list .m{color:var(--muted)}
.sk-poster .mclose{background:transparent;border-top:1.5px solid var(--line);color:var(--line);font-weight:600}

/* 모바일: 위에 정보 한 줄 + 메뉴 버튼 */
@media screen and (max-width:760px){
  #app{flex-direction:column}
  #side{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:5px;padding:8px 10px;border-right:0;border-bottom:1px solid var(--edge)}
  .info{order:1;flex:1 1 auto;min-width:0;flex-direction:row;align-items:center;gap:10px}
  .foot{order:2;margin:0}
  .menu{order:3;flex:0 0 100%;flex-direction:row;flex-wrap:wrap;gap:5px;margin:4px 0 0}
  .brand{font-size:15px}
  #docname{margin:0;flex:1;min-width:0;width:auto;-webkit-line-clamp:1;white-space:nowrap;text-overflow:ellipsis;display:block}
  #status{margin:0}
  .spacer{display:none}
  .sb{width:auto;flex:none;padding:5px 9px;font-size:12px}
  #scroll{padding:10px 8px 48px}
  .paper{width:auto;min-height:0;padding:14px 10px}
  .sheet.live{width:100%}
  .sheet.live col.c-lab{width:54px}
  .sheet.live col.c-a{width:auto}
  .sheet.live td{padding:5px 6px}
  .sheet.live td.lab,.sheet.live td.name{padding:5px 2px;white-space:normal;word-break:keep-all}
}

/* 인쇄 / PDF: A4, 네 변 여백 57px(길면 다음 장도 같은 여백) */
@media print{
  @page{size:A4;margin:var(--pm)}
  html,body{height:auto;overflow:visible;background:#fff}
  #app{display:block;height:auto}
  #side,#gate,.modal{display:none!important}
  #scroll{display:block;overflow:visible;padding:0}
  .paper{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
  .sheet tr{break-inside:avoid}
  .sk-poster .paper{background:none;border:0;box-shadow:none;padding:0}
  .sk-poster .sheet{box-shadow:none}
  .fld::placeholder{color:transparent}
}
</style>
</head>
<body>
<div id="gate" hidden>
  <div class="box">
    <div class="brand"><span class="logo">PRPS</span><svg class="hrt" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.2s-7.6-4.6-10-9.4C.3 8.4 2.3 3.8 6.3 3.8c2.3 0 4 1.3 5.7 3.5 1.7-2.2 3.4-3.5 5.7-3.5 4 0 6 4.6 4.3 8C19.6 16.6 12 21.2 12 21.2z" fill="#ef7f86" stroke="#2a60c6" stroke-width="1.1"/></svg></div>
    <p id="gmsg"></p>
    <button class="gb" id="gMain" hidden></button>
    <button class="gb sub" id="gSub" hidden></button>
  </div>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="info">
      <div class="brand"><span class="logo">PRPS</span><svg class="hrt" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.2s-7.6-4.6-10-9.4C.3 8.4 2.3 3.8 6.3 3.8c2.3 0 4 1.3 5.7 3.5 1.7-2.2 3.4-3.5 5.7-3.5 4 0 6 4.6 4.3 8C19.6 16.6 12 21.2 12 21.2z" fill="#ef7f86" stroke="#2a60c6" stroke-width="1.1"/></svg></div>
      <div id="docname"></div>
      <div id="status"></div>
    </div>
    <div class="menu">
      <button class="sb" id="bNew">새로 열기</button>
      <button class="sb" id="bOpen">불러오기</button>
      <button class="sb" id="bCopy">복제하기</button>
      <button class="sb" id="bPrint">인쇄하기</button>
      <button class="sb" id="bExport">내보내기</button>
      <button class="sb" id="bImport">가져오기</button>
      <button class="sb danger" id="bDel">삭제하기</button>
    </div>
    <div class="spacer"></div>
    <div class="foot">
      <button class="iconbtn" id="bRefresh" title="새로고침" aria-label="새로고침"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg></button>
      <button class="iconbtn" id="bDir" title="저장 폴더" aria-label="저장 폴더"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5V19h18V8.5h-9.5L9.5 6H3z"/></svg></button>
      <button class="iconbtn" id="bSkin" title="스킨 바꾸기" aria-label="스킨 바꾸기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.2-1-1.6-1-2.6 0-.9.7-1.6 1.7-1.6H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7" r="1"/></svg></button>
      <button class="iconbtn" id="bInst" title="앱 설치" aria-label="앱 설치"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10.5l5 5 5-5"/><path d="M4 20h16"/></svg></button>
    </div>
  </aside>
  <div id="scroll"><div class="paper" id="paper"></div></div>
</div>

<div class="modal" id="listModal" hidden>
  <div class="mbox" role="dialog" aria-label="기획서 목록">
    <div class="mhead">불러오기 <span id="listCount"></span></div>
    <input id="q" type="search" placeholder="제목·장르·키워드 검색" autocomplete="off">
    <ul id="list"></ul>
    <button class="mclose" id="bClose">닫기</button>
  </div>
</div>

<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const LH = 20;
  /* 칸 목록 (줄 제한 없음, 모두 1줄 크기에서 시작해 쓰는 만큼 늘어남) */
  const KEYS = ['title','genre','intent','keywords','logline','intro','c1_name','c1','c2_name','c2','c3_name','c3','ki','seung','jeon','gyeol'];
  const ONE = new Set(['title','genre','c1_name','c2_name','c3_name']);   // 엔터 = 다음 칸으로
  const PH = {title:'제목', genre:'장르', c1_name:'이름', c2_name:'이름', c3_name:'이름'};
  const PX = 'prps:';

  /* ── 한국 시간 ── */
  const two = n => String(n).padStart(2, '0');
  const kp = t => { const d = new Date(new Date(t).getTime() + 32400000);
    return {Y:d.getUTCFullYear(), M:two(d.getUTCMonth()+1), D:two(d.getUTCDate()), h:two(d.getUTCHours()), m:two(d.getUTCMinutes()), s:two(d.getUTCSeconds())}; };
  const fname = t => { const p = kp(t); return `${p.Y}${p.M}${p.D}_${p.h}${p.m}${p.s}`; };   // 파일명 = 날짜_시각 (예: 20261118_230205)
  const fmt = t => { const p = kp(t); return `${p.Y}.${p.M}.${p.D} ${p.h}:${p.m}`; };
  const hm = t => { const p = kp(t); return `${p.h}:${p.m}`; };

  /* ── 양식 ── */
  function sheetHTML(){
    const F = (k, cls='') => `<textarea class="fld ${cls}" data-f="${k}" rows="1" placeholder="${PH[k] || ''}" spellcheck="false"></textarea>`;
    const row = (label, k) => `<tr><td class="lab">${label}</td><td colspan="3">${F(k)}</td></tr>`;
    const chr = n => `<tr><td class="name">${F('c'+n+'_name','center')}</td><td colspan="3">${F('c'+n)}</td></tr>`;
    const head = t => `<tr><td colspan="4" class="head">${t}</td></tr>`;
    return `<table class="sheet live">
      <colgroup><col class="c-lab"><col class="c-a"><col class="c-lab"><col></colgroup>
      ${head('단편 소설 기획서')}
      <tr><td class="lab">제목</td><td>${F('title')}</td><td class="lab">장르</td><td>${F('genre')}</td></tr>
      ${row('기획의도','intent')}${row('키워드','keywords')}${row('로그라인','logline')}${row('소개글','intro')}
      ${head('등장인물')}${chr(1)}${chr(2)}${chr(3)}
      ${head('시놉시스')}${row('기','ki')}${row('승','seung')}${row('전','jeon')}${row('결','gyeol')}
    </table>`;
  }
  $('#paper').innerHTML = sheetHTML();
  const ed = {};
  document.querySelectorAll('.sheet.live .fld').forEach(el => ed[el.dataset.f] = el);

  function grow(el){ el.style.height = 'auto'; el.style.height = Math.max(el.scrollHeight, LH) + 'px'; }
  const growAll = () => KEYS.forEach(k => grow(ed[k]));

  /* ── 이 기기 작은 설정 ── */
  const lsG = k => { try { return JSON.parse(localStorage.getItem(PX + k) || 'null'); } catch { return null; } };
  const lsS = (k, v) => { try { localStorage.setItem(PX + k, JSON.stringify(v)); } catch {} };
  ['docs','dirty','uid'].forEach(k => { try { localStorage.removeItem(PX + k); } catch {} });   // 서버 저장 시절 사본 정리

  /* ── 저장 폴더 (PC 크롬·엣지). 폴더 핸들은 이 브라우저의 IndexedDB에 기억 ── */
  const idb = {
    open: () => new Promise((ok, no) => { const r = indexedDB.open('prps', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }),
    async run(mode, fn){ const db = await this.open(); return new Promise((ok, no) => { const tx = db.transaction('kv', mode), q = fn(tx.objectStore('kv')); tx.oncomplete = () => { db.close(); ok(q.result); }; tx.onerror = () => { db.close(); no(tx.error); }; }); },
    get: k => idb.run('readonly', s => s.get(k)),
    set: (k, v) => idb.run('readwrite', s => s.put(v, k)),
  };
  const perm = async (h, ask) => {
    if (typeof h.queryPermission !== 'function') return true;
    if ((await h.queryPermission({mode:'readwrite'})) === 'granted') return true;
    return !!ask && (await h.requestPermission({mode:'readwrite'})) === 'granted';
  };
  let dir = null;

  /* ── 기획서 = 폴더 안의 .json 파일 하나 ── */
  let docs = [], doc = null, dirty = new Set(), saveTimer = null, saving = false, failed = false;
  const uuid = () => crypto.randomUUID ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === 'x' ? r : (r&3|8)).toString(16); });
  const now = () => new Date().toISOString();
  const T = s => Date.parse(s) || 0;
  const iso = v => typeof v === 'number' ? new Date(v).toISOString() : (T(v) ? new Date(T(v)).toISOString() : now());
  const isId = s => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s);
  function blank(){ const d = {id: uuid(), created_at: now(), updated_at: now()}; KEYS.forEach(k => d[k] = ''); return d; }
  const OLD = {c1_name:'c1n', c2_name:'c2n', c3_name:'c3n'};   // 처음 판(c1n …) 파일도 읽기
  function norm(x){
    const d = blank();
    KEYS.forEach(k => { const v = x[k] ?? x[OLD[k]]; d[k] = typeof v === 'string' ? v : ''; });
    d.id = isId(String(x.id || '')) ? String(x.id) : uuid();
    d.created_at = iso(x.created_at ?? x.created); d.updated_at = iso(x.updated_at ?? x.updated);
    return d;
  }
  const isEmpty = d => KEYS.every(k => !(d[k] || '').trim());
  const recent = () => docs.slice().sort((a, b) => T(b.updated_at) - T(a.updated_at));
  const row = d => { const o = {id: d.id, created_at: d.created_at, updated_at: d.updated_at}; KEYS.forEach(k => o[k] = d[k] || ''); return o; };

  /* 폴더(특히 구글 드라이브)가 응답하지 않을 때 끝없이 기다리지 않게: 정해진 시간이 지나면 포기 */
  const limit = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(Object.assign(new Error('timeout'), {name:'TimeoutError'})), ms))]);
  async function readAll(){
    const byId = new Map();
    const names = [];
    await limit((async () => { for await (const [name, fh] of dir.entries()) { if (fh.kind === 'file' && /\.json$/i.test(name)) names.push([name, fh]); } })(), 15000);
    for (const [name, fh] of names) {
      try {
        const j = JSON.parse(await limit(fh.getFile().then(f => f.text()), 6000));   // 한 파일이 6초 넘게 안 열리면 그 파일만 건너뜀
        if (!j || j.app !== 'prps' || !j.id) continue;      // 내보내기 묶음 파일 등은 건너뜀
        const d = norm(j); d._file = name;
        const o = byId.get(d.id);
        if (!o || T(d.updated_at) > T(o.updated_at)) byId.set(d.id, d);   // 같은 기획서가 두 파일이면(동기화 충돌 사본) 최신 것
      } catch {}
    }
    return [...byId.values()];
  }
  async function exists(name){ try { await dir.getFileHandle(name); return true; } catch { return false; } }
  async function freeName(base){
    const used = new Set(docs.map(d => d._file).filter(Boolean));
    for (let i = 1; ; i++) { const n = base + (i > 1 ? '_' + i : '') + '.json'; if (!used.has(n) && !(await exists(n))) return n; }
  }
  async function writeDoc(d){
    if (!d._file) d._file = await freeName(fname(d.created_at));
    const w = await (await dir.getFileHandle(d._file, {create:true})).createWritable();
    await w.write(JSON.stringify(Object.assign({app:'prps', version:3}, row(d)), null, 2));
    await w.close();
  }

  function setStatus(msg, warn){ const s = $('#status'); s.textContent = msg; s.classList.toggle('warn', !!warn); }
  function refreshStatus(){
    if (!doc) return;
    if (failed) setStatus('저장 실패 · 폴더 확인', true);
    else if (dirty.size || saving) setStatus('저장 중…');
    else if (!doc._file) setStatus('새 기획서');
    else setStatus(`저장됨 · ${hm(doc.updated_at)}`);
  }
  function note(msg){ setStatus(msg); clearTimeout(note.t); note.t = setTimeout(refreshStatus, 2200); }

  function touch(d){ d.updated_at = now(); dirty.add(d.id); schedule(); }
  function schedule(ms = 600){ clearTimeout(saveTimer); saveTimer = setTimeout(push, ms); refreshStatus(); }
  async function push(){
    clearTimeout(saveTimer);
    if (saving || !dirty.size || !dir) return;
    saving = true;
    for (const id of [...dirty]) {
      const d = docs.find(x => x.id === id);
      if (!d) { dirty.delete(id); continue; }
      const stamp = d.updated_at;
      try { await writeDoc(d); failed = false; if (d.updated_at === stamp) dirty.delete(id); }
      catch (e) { failed = true; console.warn(e); if (e.name === 'NotAllowedError' || e.name === 'SecurityError') { saving = false; return lost(); } }
    }
    saving = false; refreshStatus();
    if (dirty.size) schedule(failed ? 5000 : 300);
  }
  /* 다른 PC에서 바뀐 파일 다시 읽기 (이 창으로 돌아올 때) */
  async function reread(){
    if (!dir || dirty.size || saving) return;
    try {
      const got = await readAll();
      const unsaved = docs.filter(d => !d._file);              // 아직 한 글자도 안 쓴 새 기획서
      docs = got.concat(unsaved.filter(u => !got.some(g => g.id === u.id)));
      const cur = doc && docs.find(d => d.id === doc.id);
      if (!cur) openStart();
      else if (cur !== doc) { if (T(cur.updated_at) > T(doc.updated_at)) loadDoc(cur, true); else { cur._file = cur._file || doc._file; doc = cur; } }
      refreshStatus();
    } catch (e) { if (e.name === 'NotAllowedError') lost(); else console.warn(e); }
  }

  /* ── 문서 열기 ── */
  function showName(){ const n = $('#docname'), t = (doc.title || '').trim(); n.textContent = t || '(제목 없음)'; n.classList.toggle('none', !t); }
  function loadDoc(d, keepScroll){
    doc = d;
    document.title = fname(d.created_at);   // 탭 이름·PDF 파일명 = 기획서를 만든 날짜_시각
    KEYS.forEach(k => ed[k].value = d[k] || '');
    showName(); growAll(); refreshStatus(); lsS('cur', d.id);
    if (!keepScroll) $('#scroll').scrollTop = 0;
  }
  function openStart(){
    const last = lsG('cur');
    let d = docs.find(x => x.id === last) || recent()[0];
    if (!d) { d = blank(); docs.push(d); }   // 파일은 첫 글자를 쓸 때 생겨요
    loadDoc(d);
  }

  /* ── 입력: 자유롭게, 칸은 쓰는 만큼 늘어남 ── */
  KEYS.forEach(k => {
    const el = ed[k];
    el.addEventListener('input', () => {
      let v = el.value;
      if (ONE.has(k)) v = v.replace(/\r?\n/g, ' ');
      const old = doc[k] || '';
      if (v !== el.value) { const c = el.selectionStart; el.value = v; el.selectionStart = el.selectionEnd = Math.min(c, v.length); }
      if (v === old) return;
      doc[k] = v;
      if (k === 'title') showName();
      grow(el); touch(doc);
    });
    if (ONE.has(k)) el.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); const i = KEYS.indexOf(k); if (i < KEYS.length - 1) ed[KEYS[i+1]].focus(); }
    });
  });

  /* ── 메뉴 ── (불러오기 전에 눌러도 오류 안 나게) */
  ['#bNew','#bCopy','#bDel','#bPrint','#bExport','#bImport','#bOpen'].forEach(id => $(id).addEventListener('click', e => { if (!doc) { e.stopImmediatePropagation(); note('아직 불러오는 중이에요'); } }, true));
  $('#bNew').onclick = () => {
    if (isEmpty(doc)) { ed.title.focus(); note('빈 기획서가 이미 열려 있어요'); return; }
    if (!doc._file) docs = docs.filter(x => x !== doc);
    const d = blank(); docs.push(d); loadDoc(d); ed.title.focus();
  };
  $('#bCopy').onclick = () => {   // 복제하기
    const d = Object.assign(blank(), row(doc), {id: uuid(), created_at: now(), updated_at: now()});
    d.title = (doc.title || '').trim() ? `${doc.title} (복제)` : '';
    docs.push(d); loadDoc(d); touch(d); note('복제했어요');
  };
  $('#bDel').onclick = async () => {
    const name = (doc.title || '').trim() || '(제목 없음)';
    if (!confirm(`'${name}' 기획서를 삭제할까요?\n폴더의 파일(${doc._file || '아직 없음'})도 지워지고 되돌릴 수 없습니다.`)) return;
    const d = doc;
    if (d._file) { try { await dir.removeEntry(d._file); } catch (e) { if (e.name !== 'NotFoundError') { alert('파일을 지우지 못했어요.\n' + e.message); return; } } }
    docs = docs.filter(x => x !== d); dirty.delete(d.id);
    doc = null; openStart();
  };
  $('#bPrint').onclick = () => window.print();
  addEventListener('beforeprint', () => { if (doc) document.title = fname(doc.created_at); });   // Ctrl+P로 인쇄해도 같은 파일명
  $('#bRefresh').onclick = async () => { if (dirty.size) await push(); location.reload(); };

  /* 내보내기 · 가져오기 */
  $('#bExport').onclick = () => {
    const body = JSON.stringify({app:'prps-export', version:3, exported: now(), docs: recent().filter(d => d._file).map(row)}, null, 2);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], {type:'application/json'}));
    a.download = `${fname(Date.now())}.json`;   // 파일명 = 내보낸 날짜_시각
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('#bImport').onclick = () => $('#fileIn').click();
  $('#fileIn').onchange = async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    let arr;
    try { const j = JSON.parse(await f.text()); arr = Array.isArray(j) ? j : Array.isArray(j.docs) ? j.docs : (j && j.app === 'prps' && j.id ? [j] : null); if (!arr) throw 0; }
    catch { alert('PRPS 파일이 아니에요.'); return; }
    let add = 0, upd = 0, skip = 0;
    arr.forEach(x => {
      if (!x || typeof x !== 'object') { skip++; return; }
      const d = norm(x), i = docs.findIndex(y => y.id === d.id);
      if (i < 0) { docs.push(d); dirty.add(d.id); add++; }
      else if (T(d.updated_at) > T(docs[i].updated_at)) { d._file = docs[i]._file; docs[i] = d; dirty.add(d.id); upd++; }
      else skip++;
    });
    if (add && !doc._file && isEmpty(doc)) docs = docs.filter(x => x !== doc);
    loadDoc(docs.find(d => d.id === doc.id) || recent()[0]); schedule(100);
    alert(`가져오기 완료\n새로 추가 ${add}개 · 최신으로 교체 ${upd}개 · 건너뜀 ${skip}개`);
  };

  /* ── 불러오기 팝업 (다시 열면 보던 스크롤 그대로) ── */
  const modal = $('#listModal'), list = $('#list');
  let listScroll = 0;
  function renderList(){
    const q = $('#q').value.trim().toLowerCase(), all = recent().filter(d => d._file || d === doc);
    const rows = all.filter(d => !q || ['title','genre','keywords','logline'].some(k => (d[k] || '').toLowerCase().includes(q)));
    $('#listCount').textContent = q ? `${rows.length} / ${all.length}개` : `${all.length}개`;
    list.innerHTML = rows.length ? rows.map(d => `<li data-id="${esc(d.id)}" class="${d.id === doc.id ? 'cur' : ''}">
        <div class="t">${esc((d.title || '').trim() || '(제목 없음)')}</div>
        <div class="m">${esc(d._file ? d._file.replace(/\.json$/i, '') : fname(d.created_at))}${d.genre ? ' · ' + esc(d.genre) : ''} · 수정 ${fmt(d.updated_at)}</div></li>`).join('')
      : `<li class="empty">${q ? '검색 결과가 없어요' : '기획서가 없어요'}</li>`;
  }
  function openList(){ renderList(); modal.hidden = false; list.scrollTop = listScroll; }
  function closeList(){ listScroll = list.scrollTop; modal.hidden = true; }
  $('#bOpen').onclick = openList;
  $('#bClose').onclick = closeList;
  modal.addEventListener('click', e => { if (e.target === modal) closeList(); });
  $('#q').addEventListener('input', () => { renderList(); list.scrollTop = 0; });
  list.addEventListener('click', e => {
    const li = e.target.closest('li[data-id]'); if (!li) return;
    const d = docs.find(x => x.id === li.dataset.id);
    closeList();
    if (d && d !== doc) { if (!doc._file) docs = docs.filter(x => x !== doc); loadDoc(d); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !modal.hidden) closeList();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); push(); }
  });

  /* ── 폴더 연결 화면 ── */
  function gate(msg, main, sub){
    $('#app').hidden = true; $('#gate').hidden = false;
    $('#gmsg').innerHTML = msg;
    const m = $('#gMain'), s = $('#gSub');
    m.hidden = !main; s.hidden = !sub;
    if (main) { m.textContent = main[0]; m.onclick = main[1]; }
    if (sub) { s.textContent = sub[0]; s.onclick = sub[1]; }
  }
  async function pickDir(){
    let h;
    try { h = await showDirectoryPicker({mode:'readwrite', id:'prps-docs'}); } catch { return; }   // 창을 닫으면 그대로
    if (!(await perm(h, true))) return;
    await idb.set('dir', h).catch(() => {});
    await useDir(h);
  }
  function stuck(h){
    dir = null;
    gate(`저장 폴더 <b>${esc(h.name)}</b>가 응답하지 않아요.<small>구글 드라이브(PC용)가 켜져 있고 동기화가 끝났는지 확인한 뒤 다시 시도해 주세요.</small>`,
      ['다시 시도', () => useDir(h)], ['다른 폴더 고르기', pickDir]);
  }
  function lost(){
    dir = null;
    gate('저장 폴더에 쓸 권한이 꺼졌어요.<small>아래 버튼을 눌러 다시 허락해 주세요.</small>', ['폴더 다시 열기', start], ['다른 폴더 고르기', pickDir]);
  }
  async function useDir(h){
    dir = h;
    $('#bDir').title = '저장 폴더: ' + h.name + ' (눌러서 바꾸기)';
    $('#gate').hidden = true; $('#app').hidden = false;
    setStatus('불러오는 중…');
    try { docs = await readAll(); }
    catch (e) {
      console.warn(e);
      if (e.name === 'TimeoutError') return stuck(h);
      return lost();
    }
    doc = null; openStart();
    if (dirty.size) schedule(100);
  }
  async function start(){
    if (typeof window.showDirectoryPicker !== 'function') {
      return gate('PRPS는 기획서를 PC 폴더에 파일로 저장해요.<small>PC의 크롬이나 엣지에서 열어 주세요.<br>휴대폰·이 브라우저에서는 폴더를 쓸 수 없어요.</small>');
    }
    const h = await limit(idb.get('dir'), 5000).catch(() => null);
    if (h && await limit(perm(h, false), 5000).catch(() => false)) return useDir(h);
    if (h) return gate(`저장 폴더 <b>${esc(h.name)}</b>를 다시 열어요.<small>브라우저가 폴더 사용을 물으면 허용을 눌러 주세요.<br>('방문할 때마다 허용'을 고르면 다음부터는 바로 열려요.)</small>`,
      ['폴더 열기', async () => { if (await perm(h, true).catch(() => false)) useDir(h); }], ['다른 폴더 고르기', pickDir]);
    gate('기획서를 저장할 폴더를 골라 주세요.<small>기획서마다 날짜_시각 이름의 파일이 생겨요.<br>구글 드라이브 폴더를 고르면 PC끼리 자동으로 맞춰져요.</small>', ['폴더 고르기', pickDir]);
  }
  $('#bDir').onclick = async () => {
    if (dirty.size) await push();
    if (!confirm(`지금 저장 폴더: ${dir ? dir.name : '-'}\n다른 폴더로 바꿀까요? (지금 폴더의 파일은 그대로 남아요)`)) return;
    pickDir();
  };

  /* ── 스킨 (이 기기에 기억) ── */
  const SKINS = [['basic','기본'], ['poster','포스터']];
  function setSkin(k){
    if (!SKINS.some(x => x[0] === k)) k = 'basic';
    SKINS.forEach(x => document.body.classList.toggle('sk-' + x[0], x[0] === k));
    lsS('skin', k);
    document.querySelector('meta[name=theme-color]').content = k === 'poster' ? '#e9e6cf' : '#f6f8fa';
    return k;
  }
  setSkin(lsG('skin') || 'basic');
  $('#bSkin').onclick = () => {
    const i = SKINS.findIndex(x => document.body.classList.contains('sk-' + x[0]));
    const k = setSkin(SKINS[(i + 1) % SKINS.length][0]);
    if (doc) note('스킨: ' + SKINS.find(x => x[0] === k)[1]);
  };

  /* ── 📲 설치 ── */
  let dp = null;
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  $('#bInst').hidden = !!standalone;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); dp = e; });
  addEventListener('appinstalled', () => { dp = null; $('#bInst').hidden = true; });
  $('#bInst').onclick = async () => {
    if (dp) { dp.prompt(); await dp.userChoice; dp = null; return; }
    let had = false; try { had = navigator.getInstalledRelatedApps && (await navigator.getInstalledRelatedApps()).length > 0; } catch {}
    alert((had ? 'PRPS가 이미 이 기기에 설치돼 있어요.\n' : '') + '지금은 바로 설치할 수 없어요.\n이미 깔려 있다면 기존 PRPS를 지우고 이 페이지를 새로고침하면 설치 버튼이 동작해요.\n또는 크롬 메뉴(⋮) → "앱 설치"를 눌러도 돼요.');
  };

  /* ── 시작 ── */
  window.addEventListener('pagehide', () => { if (dirty.size) push(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (dirty.size) push(); } else reread(); });
  window.addEventListener('focus', reread);
  let rw = innerWidth;
  window.addEventListener('resize', () => { if (innerWidth !== rw) { rw = innerWidth; growAll(); } });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => doc && growAll());
  start();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
